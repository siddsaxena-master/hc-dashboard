<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c4532;
    color: #1f2a24;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 16px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    box-sizing: border-box;
  }
  h1 { font-size: 22px; margin: 0 0 12px; color: #1c4532; }
  p { font-size: 16px; margin: 0 0 24px; color: #3b4a42; }
  .btn {
    display: inline-block;
    background: #1c4532;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 22px;
    border-radius: 10px;
  }
  .btn:hover, .btn:focus { background: #2a6148; }
</style>

<body>
<main class="card">
  <h1>Dashboard moved</h1>
  <p>This dashboard has moved to app.hamptonscoconuts.com. Sign in there with your work email.</p>
  <a class="btn" href="https://app.hamptonscoconuts.com/" rel="noopener">Go to app.hamptonscoconuts.com</a>
</main>
<script>
// Clean up the OLD dashboard on this device.
// The old version saved a copy of itself on phones (a "service worker" plus
// saved files in "Cache Storage"). This removes both so the device stops
// showing the old app. Safe to run any number of times: a second run just
// finds nothing left to remove. Every step is wrapped so an older browser
// without these features simply skips it.
(function () {
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        })
        .catch(function () {});
    }
  } catch (e) {}
  try {
    if (typeof caches !== 'undefined' && caches.keys) {
      caches.keys()
        .then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        })
        .catch(function () {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
