name = "hc-telegram-bot"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "0 12 * * *",     # 8am ET (12 UTC) — daily Weee box math digest
  "0 * * * *",      # every hour — reconfirmation scan + post-event debrief scan
  "*/5 * * * *",    # every 5 minutes — intake approval cards (summary + buttons)
]

# Secrets (set via `wrangler secret put <NAME>`):
# SAFE WEBHOOK ROLLOUT: apply migrations 024 and 027 first. Then configure the
# droplet's TELEGRAM_BOT_TOKEN and current outbox key, restart and verify the new
# pushdrain, and only then deploy this Worker and enable provider delivery.
# The new drainer requires migration 027 columns. The old drainer cannot read
# encrypted webhook_telegram rows.
# ANTHROPIC_API_KEY - Claude API key for natural language processing
# SUPABASE_URL - https://omdcfphbwuwsrffdszlg.supabase.co
# SUPABASE_SERVICE_KEY - service_role key (bypasses RLS, set via wrangler secret put)
# TG_BOT_TOKEN - Telegram bot token from @BotFather
# ALLOWED_CHAT_IDS - Comma-separated Telegram chat IDs allowed to use the bot
# FORMSPREE_WEBHOOK_SIGNING_SECRET - Required signing_secret from the
#   Formspree webhook settings. The Worker rejects Formspree requests without it.
# QUO_WEBHOOK_SIGNING_KEY - Required base64 signing key from Quo's
#   "Reveal signing secret" action. The Worker rejects Quo requests without it.
# MS_GRAPH_CLIENT_STATE - Required secret value also supplied when the Microsoft
#   Graph subscription is created. Every notification must contain this value.
# MS_GRAPH_ALLOWED_SUBSCRIPTION_IDS - Optional comma-separated subscription IDs.
# MS_GRAPH_ALLOWED_TENANT_IDS - Optional comma-separated Microsoft tenant IDs.
# WEBHOOK_OUTBOX_ID_KEY - Required base64-encoded 32-byte HMAC key. Keep this
#   stable across encryption-key rotation because it creates durable queue IDs.
# WEBHOOK_OUTBOX_ENCRYPTION_KEY_CURRENT - Required `<version>:<base64>` value,
#   where the decoded key is exactly 32 bytes. The Worker encrypts new rows with
#   this version. pushdrain must have the same current key before Worker rollout.
# WEBHOOK_OUTBOX_ENCRYPTION_KEY_PREVIOUS - Optional pushdrain-only value in the
#   same format. Keep it during rotation until every old queue row is finished.
# The WEBHOOK_OUTBOX_* keys serve Formspree and Quo alerts only. Since
#   2026-09-22 (Sidd: no Telegram alerts for forwarded email) the ms-graph path
#   writes lead rows and notes only and never reads them
#   (MS_GRAPH_TELEGRAM_ALERTS in worker.js).
# TG_WEBHOOK_SECRET - REQUIRED (2026-07-25 security review). Any long
#   random string. The root webhook now returns 503 before parsing when this
#   secret is missing. Once set, the worker requires
#   Telegram's X-Telegram-Bot-Api-Secret-Token header on every delivery
#   (chat messages AND button taps), so IMMEDIATELY after the deploy
#   register it with Telegram, header not query string:
#     curl -H "X-Setup-Secret: <value>" https://<worker-url>/setup-telegram-webhook
#   Between the deploy and that call, Telegram deliveries get 401 and are
#   retried, so do not stop halfway.
# CLAUDIA CHAT ORDER WRITES (M3 of the 2026-09-23 unified app audit). The
# Telegram chat can create, update and delete orders with the service key,
# which skips HC App and its payment guards. One setting, a secret, never in
# this file:
# CLAUDIA_CHAT_ORDER_WRITES - unset, blank or 'on' keeps today's chat exactly
#   (writes allowed). Any other value (use 'off') makes the chat answers-only:
#   questions are still answered from the order list, but every create,
#   update or delete intent writes NOTHING and gets one plain reply: "Chat
#   edits are off, so nothing was changed. Please make this change in HC App:
#   https://app.hamptonscoconuts.com". A mistyped value also counts as off.
#   While off, the chat also never reports who paid: the order list it reads
#   shows no payment stages and no received amounts (QuickBooks through
#   Jarvis is the payment truth).
#   Turn off: `wrangler secret put CLAUDIA_CHAT_ORDER_WRITES`, value off.
#   Undo: `wrangler secret delete CLAUDIA_CHAT_ORDER_WRITES` (back to writes
#   allowed). Intake card buttons (Invoice it / Skip) are not affected.
#   Tests: node worker/test-chat-order-writes.mjs
# DEPARTURE PLAN ROUTING (2026-09-13, Sidd chose Apple Maps). Set the three
# Apple values from the developer account's Maps key (Certificates,
# Identifiers & Profiles > Keys > a key with the Maps service; Identifiers >
# a Maps ID). Sidd pastes them himself from his own terminal:
# APPLE_MAPS_KEY_ID - the 10-character key id from the .p8 file name
# APPLE_MAPS_TEAM_ID - the Apple developer team id
# APPLE_MAPS_PRIVATE_KEY - the whole .p8 file text (BEGIN/END lines included)
# GOOGLE_ROUTES_API_KEY - optional fallback; used only when the Apple trio is
#   absent. Without either, every plan says "routing unavailable" and sends
#   no leave-by alerts; it never invents a drive time.
# Migrations 040 (order_departures) and 041 (crew push tokens) must be live
# and the droplet drainer swapped BEFORE this Worker is deployed with the
# departure scan. Deploy from feature/departure-plan (or its merge), never
# from main (main has none of the field-ops code).
# TEAM INVITE (2026-09-14, HC Field build 34): POST /team/invite adds a new
# hire (a Supabase login plus a field_workers row) and, best effort, invites
# the email to TestFlight. The four values below are OPTIONAL. Without the
# first three the route still creates the login and the row and answers
# testflight 'skipped: no App Store Connect key on the worker'. They come
# from App Store Connect > Users and Access > Integrations > App Store
# Connect API (a Team key with the App Manager role). All four were loaded
# on 2026-09-14 (`wrangler secret list` shows the names); to rotate, paste
# the new value with `wrangler secret put <NAME>`:
# ASC_KEY_ID - the 10-character key id shown next to the key
# ASC_ISSUER_ID - the issuer id (a UUID) shown at the top of that page
# ASC_PRIVATE_KEY - the whole AuthKey_<key id>.p8 file text (BEGIN/END lines
#   included). Apple hands it out once; keep the file somewhere safe.
# ASC_CREW_GROUP_ID - optional; the TestFlight beta group a new hire joins.
#   Defaults in code to the HC crew group 4976ebfe-29f5-47b9-92e7-a314bbb271a1.
# RECONFIRMATION EMAILS (2026-09-14, RECONFIRMATION-CONTRACT-2026-09-14.md
# section 2). The hourly runReconfirmationScan drafts the customer's "quick
# reconfirm" email into order_reconfirmations (migration 044 must be live
# first); the droplet sends released rows from sidd@hamptonscoconuts.com and
# the HC Field app (build 35) carries Send now / Hold / Skip. Four settings,
# all read from env; set the switches with `wrangler secret put` too so
# they never sit in this file:
# RECONFIRM_MODE - 'off' (the default when unset: the scan returns at once
#   and drafts nothing), 'preview' (drafts, previews on the owner's phone,
#   sends only on a Send now tap), or 'auto' (untouched drafts are released
#   at their send_after time, 10:00 market time four days before delivery).
#   Flipping to 'auto' is its own "yes do it" (plan section 9, Phase C).
# RECONFIRM_DAILY_CAP - integer, default 8: automatic releases per market per
#   day, counted by the moment each row was released (the release stamps
#   send_after with that instant). The owner's own Send now taps are never
#   capped; a row the owner held and released by hand still counts. Nothing
#   is released outside 08:00 to 21:00 market time. A bad data backfill can
#   therefore never fan out more than this many emails a day.
# RECONFIRM_TEST_TO - Phase A only: Sidd's own test address. When set, the
#   worker stamps it into every row's test_to (on insert and on every
#   rewrite; cleared again on the next rewrite once the setting is gone) so
#   the app shows "Test mode" and the droplet sends only to that address
#   with the "[TEST for ...]" subject tag. A test copy never marks the row
#   sent (the droplet puts it back to ready with no send_after), so the
#   real email can still go out later. Remove it before Phase B.
# OWNER_CELL - Sidd's cell number as printed in the email ("Your contact on
#   our side: Sidd, <cell>, sidd@hamptonscoconuts.com" and the sign-off). A
#   secret: never in code, never in this file. When unset the contact line
#   omits the number and the sign-off ends at "Hamptons Coconuts".
# Eligibility needs MONEY RECORDED (deposit_cents plus balance_cents above
# zero) with a stage of invoiced, deposit_paid or paid_full: a hand-set paid
# stage with nothing recorded is never drafted, and the 8am digest names it
# under "Stage says paid but nothing recorded, check QuickBooks".
# Push bodies from this scan never carry an email, phone or dollar; the
# email body never carries an amount, a crew name, the garage, or internal
# notes. Deploy from feature/departure-plan, never from main.
# ADDRESS PROPOSALS (2026-09-15, PHASE2-ADDRESS-PROPOSALS-PLAN-2026-09-15.md
# sections 4 and 5a). The 5-minute runProposalScan also reads a drop off
# address out of every linked, invoiced customer email (body and PDF text)
# and, when it is not already on the invoice in full, writes one
# order_address_proposals row (migration 045 must be live first) and sends
# one owner-only "Address?" banner. Accept in HC Field (build 36) only
# QUEUES the address; Jarvis writes it to QuickBooks on the droplet behind
# its own JARVIS_ADDRESS_APPLY switch. Two settings, both secrets, both
# default off, never in this file:
# ADDRESS_PROPOSALS - 'on' enables the address branch, the replayed-row
#   dismissal and the applied/failed follow-up banners; unset (or any other
#   value) means off and the scan behaves exactly as before. Keep it unset
#   until build 36 is on Sidd's phone (build 35 would get a banner with no
#   row to act on). `wrangler secret put ADDRESS_PROPOSALS`, value on;
#   `wrangler secret delete ADDRESS_PROPOSALS` is the kill switch (the next
#   tick proposes nothing; rows already made stay for the phone).
# OWN_ADDRESS_DENYLIST - comma separated "house number plus first street
#   word" prefixes of our OWN addresses (home, any office, a Vegas address,
#   anything in Sidd's signature), so a forwarded email can never propose
#   them. The NJ garage (55 cambridge) is pinned in code (OWN_ADDRESS_MARKS);
#   Sidd supplies the rest before the switch goes on. Example value:
#   "12 main, 3708 las" (a direction word may be left out or written; both
#   match "3708 S Las Vegas Blvd"). Unset means only the garage is denied.
# The replay script's rows (intake_messages.replayed_at set) are hidden from
# every Telegram-facing read by fetchIntakeLive; a worker deployed before
# 045 logs the missing column once and reads without the filter.
# ARTWORK PROPOSALS (2026-09-21, PHASE3-ARTWORK-PLAN-2026-09-21.md sections
# 5b and 7). The droplet's artwork pass (outlook poller, behind its own
# ARTWORK_FETCH_ENABLED in the droplet .env) fetches, fingerprints and
# previews a customer's artwork files into the private order-logos bucket
# and writes one order_artwork_proposals row per file (migration 048 must
# be live first). The 5-minute runProposalScan then sends one owner-only
# "Artwork?" banner per email (never a file name) and retires rows whose
# order was cancelled, whose delivery day passed, whose invoice moved or
# whose card artwork changed since the scan. Only the owner's Use it in HC
# Field (build 38 or later, hc_decide_proposed_artwork) puts a file on a
# card; this worker never fetches bytes, never renders, never writes
# artwork. One setting, a secret, default off, never in this file:
# ARTWORK_PROPOSALS - 'on' enables the banners and the retirements; unset
#   (or any other value) means off and the scan behaves exactly as before.
#   Keep it unset until the build is on Sidd's phone (a banner saying
#   "Open Needs you" must never point at nothing). `wrangler secret put
#   ARTWORK_PROPOSALS`, value on; `wrangler secret delete ARTWORK_PROPOSALS`
#   is the kill switch (rows already in the table stay visible in the app,
#   so tell Sidd).
